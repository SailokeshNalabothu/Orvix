<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Orvix: distributed AI control plane and FinOps billing engine" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#111a3b"/>
      <stop offset="1" stop-color="#1d1250"/>
    </linearGradient>
    <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="430" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;360 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .edge { stroke: #6366f1; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
      .dash { stroke-dasharray: 5 6; animation: d 1.4s linear infinite; }
      @keyframes d { to { stroke-dashoffset: -11; } }
      .lbl { font-size: 12px; fill: #94a3b8; }
      .fi { animation: fi 0.9s ease both; }
      @keyframes fi { from { opacity: 0; } to { opacity: 1; } }
      .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s ease 0.5s both; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- network graph (right) -->
  <g>
    <path class="edge dash" d="M960,150 L800,75"/>
    <path class="edge dash" d="M960,150 L1100,65"/>
    <path class="edge dash" d="M960,150 L830,240"/>
    <path class="edge dash" d="M960,150 L1105,235"/>
    <path class="edge dash" d="M960,150 L965,40"/>
    <path class="edge" d="M800,75 L965,40 L1100,65" stroke-opacity="0.25"/>
    <path class="edge" d="M830,240 L1105,235" stroke-opacity="0.25"/>

    <!-- hub pulse -->
    <circle cx="960" cy="150" r="20" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="20;58" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="150" r="20" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="20;58" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="150" r="18" fill="url(#hub)" filter="url(#glow)"/>
    <text x="960" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">GW</text>

    <!-- nodes -->
    <g fill="#38bdf8" filter="url(#glow)">
      <circle cx="800" cy="75" r="5"><animate attributeName="r" values="4;6.5;4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="65" r="5"><animate attributeName="r" values="4;6.5;4" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="240" r="5"><animate attributeName="r" values="4;6.5;4" dur="3.2s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="1105" cy="235" r="5"><animate attributeName="r" values="4;6.5;4" dur="3.6s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="965" cy="40" r="5"><animate attributeName="r" values="4;6.5;4" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    </g>
    <text class="lbl" x="800" y="58" text-anchor="middle">Guardrail</text>
    <text class="lbl" x="1100" y="48" text-anchor="middle">Cache</text>
    <text class="lbl" x="830" y="266" text-anchor="middle">Billing</text>
    <text class="lbl" x="1105" y="261" text-anchor="middle">Kafka</text>
    <text class="lbl" x="965" y="24" text-anchor="middle">Redis</text>

    <!-- packets -->
    <g fill="#ffffff" filter="url(#glow)">
      <circle r="3.5" opacity="0"><animateMotion dur="2.6s" repeatCount="indefinite" path="M960,150 L800,75"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle r="3.5" opacity="0"><animateMotion dur="3.1s" begin="0.6s" repeatCount="indefinite" path="M1100,65 L960,150"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle r="3.5" opacity="0"><animateMotion dur="2.8s" begin="1.1s" repeatCount="indefinite" path="M960,150 L830,240"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle r="3.5" opacity="0"><animateMotion dur="3.4s" begin="0.3s" repeatCount="indefinite" path="M1105,235 L960,150"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle r="3.5" opacity="0"><animateMotion dur="2.2s" begin="1.6s" repeatCount="indefinite" path="M960,150 L965,40"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- title block (left) -->
  <text class="fi" x="66" y="150" font-size="108" font-weight="800" letter-spacing="6" fill="url(#tg)" style="animation-duration:1.1s">Orvix</text>
  <rect class="grow" x="72" y="170" width="150" height="3" rx="1.5" fill="#38bdf8"/>
  <text class="fi" x="70" y="212" font-size="28" font-weight="600" fill="#e2e8f0" style="animation-delay:0.7s">Distributed AI control plane</text>
  <text class="fi" x="70" y="246" font-size="17" fill="#94a3b8" style="animation-delay:1s">Guardrail firewall, semantic cache and FinOps billing</text>
  <text class="fi" x="70" y="270" font-size="17" fill="#94a3b8" style="animation-delay:1.2s">between your tenants and every LLM provider</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
