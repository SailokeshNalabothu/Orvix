services:
  # =====================================================================
  # PostgreSQL 16 + pgvector (Multi-database: billing_db, guardrail_db, cache_db)
  # =====================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orvix-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orvix
      POSTGRES_PASSWORD: orvix_secret
      POSTGRES_DB: postgres
    volumes:
      - ./docker/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvix -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =====================================================================
  # Redis 7.x (Rate Limiting Lua Scripts, Quota Block Flags, Auth Cache)
  # =====================================================================
  redis:
    image: redis:7-alpine
    container_name: orvix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =====================================================================
  # Apache Kafka (KRaft mode - Zero ZooKeeper)
  # =====================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: orvix-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Helper service to initialize required Kafka topics
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: orvix-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      # Block until Kafka is reachable
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

      echo 'Creating Kafka topics...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orvix.usage.recorded --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orvix.usage.dlq --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orvix.quota.exhausted --partitions 3 --replication-factor 1

      echo 'Kafka topics created successfully:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

  # =====================================================================
  # Jaeger (Distributed Tracing - OpenTelemetry / W3C traceparent)
  # =====================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: orvix-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # =====================================================================
  # Prometheus (Metrics Collector)
  # =====================================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: orvix-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
