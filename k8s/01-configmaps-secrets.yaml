apiVersion: v1
kind: ConfigMap
metadata:
  name: orvix-config
  namespace: orvix-system
  labels:
    app.kubernetes.io/part-of: orvix-ai-control-plane
data:
  SPRING_PROFILES_ACTIVE: "k8s,prod"
  REDIS_HOST: "redis-svc"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-svc:9092"
  POSTGRES_HOST: "postgres-svc"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "orvix"
  
  # Microservice Cross-Communication Endpoints
  GUARDRAIL_SERVICE_URL: "http://guardrail-service:8081"
  CACHE_SERVICE_URL: "http://cache-service:8082"
  BILLING_SERVICE_URL: "http://billing-service:8083"
  GATEWAY_SERVICE_URL: "http://gateway-service:8080"
  
  # Metrics and Management
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: orvix-secrets
  namespace: orvix-system
  labels:
    app.kubernetes.io/part-of: orvix-ai-control-plane
type: Opaque
stringData:
  POSTGRES_PASSWORD: "orvix_secure_password"
  REDIS_PASSWORD: ""
  UPSTREAM_GEMINI_API_KEY: "mock_gemini_production_key"
  UPSTREAM_OPENAI_API_KEY: "mock_openai_fallback_key"
