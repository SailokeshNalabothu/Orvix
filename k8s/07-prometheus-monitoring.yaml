apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: orvix-system
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: orvix-ai-control-plane
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'orvix-gateway'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['gateway-service:8080']

      - job_name: 'orvix-guardrail'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['guardrail-service:8081']

      - job_name: 'orvix-cache'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['cache-service:8082']

      - job_name: 'orvix-billing'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['billing-service:8083']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: orvix-system
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: orvix-ai-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/component: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
              name: prometheus
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: orvix-system
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: orvix-ai-control-plane
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: prometheus
  selector:
    app.kubernetes.io/component: prometheus
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orvix-services-monitor
  namespace: orvix-system
  labels:
    app.kubernetes.io/part-of: orvix-ai-control-plane
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: orvix-ai-control-plane
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
