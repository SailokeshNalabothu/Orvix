apiVersion: v1
kind: Secret
metadata:
  name: orvix-secrets
  labels:
    {{- include "orvix.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: "{{ .Values.infrastructure.postgres.password }}"
  REDIS_PASSWORD: "{{ .Values.infrastructure.redis.password }}"
  UPSTREAM_GEMINI_API_KEY: "mock_gemini_production_key"
  UPSTREAM_OPENAI_API_KEY: "mock_openai_fallback_key"
