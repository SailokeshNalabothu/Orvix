apiVersion: v1
kind: ConfigMap
metadata:
  name: orvix-config
  labels:
    {{- include "orvix.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: "k8s,prod"
  REDIS_HOST: "{{ .Values.infrastructure.redis.host }}"
  REDIS_PORT: "{{ .Values.infrastructure.redis.port }}"
  KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.infrastructure.kafka.bootstrapServers }}"
  POSTGRES_HOST: "{{ .Values.infrastructure.postgres.host }}"
  POSTGRES_PORT: "{{ .Values.infrastructure.postgres.port }}"
  POSTGRES_USER: "{{ .Values.infrastructure.postgres.username }}"
  
  # Microservice Cross-Communication Endpoints
  GUARDRAIL_SERVICE_URL: "http://guardrail-service:8081"
  CACHE_SERVICE_URL: "http://cache-service:8082"
  BILLING_SERVICE_URL: "http://billing-service:8083"
  GATEWAY_SERVICE_URL: "http://gateway-service:8080"
  
  # Metrics and Management
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
